# ╔══════════════════════════════════════════════════════════════════╗
# ║        Beckn AI Agent Marketplace — Docker Compose              ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                 ║
# ║  Usage:                                                         ║
# ║    docker compose up --build            # All services           ║
# ║    docker compose up --build bpp-provider  # Only BPP + deps    ║
# ║    docker compose logs -f bpp-provider     # Follow BPP logs    ║
# ║                                                                 ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                 ║
# ║  Architecture (how services interact):                          ║
# ║                                                                 ║
# ║  [Frontend] → [bap-marketplace] → [onix-bap] ↔ [onix-bpp]      ║
# ║   (future)     BAP buyer side      firma       firma             ║
# ║                :3001               :8081       :8082             ║
# ║                                                    ↓             ║
# ║                                              [bpp-provider]     ║
# ║                                               BPP agent catalog ║
# ║                                               :3002             ║
# ║                                                       ↓         ║
# ║                                                  [orchestrator] ║
# ║                                                   ejecuta agts  ║
# ║                                                   :3003         ║
# ║                                                       ↓         ║
# ║                                                  [agents]       ║
# ║                                                   agentes IA    ║
# ║                                                   :3004 (fut.)  ║
# ║                                                                 ║
# ║  [redis] — cache compartido para ONIX (registry lookups)        ║
# ║                                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝

services:

  # ─── Infrastructure ───────────────────────────────────────────────
  #
  # Servicios base que NO se modifican. Son dependencias externas.

  # MOCK NETWORK — simulates the Beckn network services we cannot run
  # locally with our own identities:
  #   - DeDi registry (subscriber/key lookup consumed by ONIX) — hardcoded data
  #   - Registry (BPP onboarding + liveness) — Postgres-backed (Pieza 3)
  #   - CDS publish/discover (Pieza 1+2) — Postgres + pgvector backed
  # Replaces what would otherwise live at fabric.nfh.global.
  mock-network:
    build:
      context: ..
      dockerfile: services/mock-network/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DB_HOST=postgres-mocknet
      - DB_PORT=5432
      - DB_NAME=${MOCKNET_DB_NAME}
      - DB_USER=${MOCKNET_DB_USER}
      - DB_PASSWORD=${MOCKNET_DB_PASSWORD}
    depends_on:
      postgres-mocknet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # BAP database — buyer side. Independent instance per Beckn v2 model:
  # BAP and BPP are independent participants, so they keep separate state.
  # Only services/bap/* connects here.
  postgres-bap:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=${BAP_DB_NAME}
      - POSTGRES_USER=${BAP_DB_USER}
      - POSTGRES_PASSWORD=${BAP_DB_PASSWORD}
    volumes:
      - ./db/bap/migrations:/docker-entrypoint-initdb.d/migrations
      - ./db/bap/init.sh:/docker-entrypoint-initdb.d/init.sh
      - pgdata-bap:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - beckn_network

  # BPP database — provider side. Independent instance.
  # Only services/bpp/* connects here.
  postgres-bpp:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=${BPP_DB_NAME}
      - POSTGRES_USER=${BPP_DB_USER}
      - POSTGRES_PASSWORD=${BPP_DB_PASSWORD}
    volumes:
      - ./db/bpp/migrations:/docker-entrypoint-initdb.d/migrations
      - ./db/bpp/init.sh:/docker-entrypoint-initdb.d/init.sh
      - pgdata-bpp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - beckn_network

  # Mock-network database — Registry + CDS state. Independent instance.
  # Uses pgvector image because Pieza 1 (catalog publish) will store agent
  # embeddings as `vector(384)` columns; loading the extension here keeps
  # later migrations idempotent. Only services/mock-network/* connects.
  postgres-mocknet:
    image: pgvector/pgvector:pg16
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=${MOCKNET_DB_NAME}
      - POSTGRES_USER=${MOCKNET_DB_USER}
      - POSTGRES_PASSWORD=${MOCKNET_DB_PASSWORD}
    volumes:
      - ./db/mocknet/migrations:/docker-entrypoint-initdb.d/migrations
      - ./db/mocknet/init.sh:/docker-entrypoint-initdb.d/init.sh
      - pgdata-mocknet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - beckn_network

  # ─── ONIX Adapters (Beckn protocol middleware) ────────────────────
  #
  # ONIX es un binario Go precompilado que actua como proxy entre
  # nuestros servicios y la red Beckn. NO se modifica su codigo.
  #
  # Cada adapter tiene dos "lados":
  #   - Caller  (/bap/caller or /bpp/caller)  = salida → hacia la red
  #   - Receiver (/bap/receiver or /bpp/receiver) = entrada ← desde la red
  #
  # Pipeline:
  #   Caller:   addRoute → sign → validateSchema
  #   Receiver: validateSign → addRoute → validateSchema

  onix-bap:
    image: fidedocker/onix-adapter
    platform: linux/amd64
    command: ["./server", "--config=/app/config/bap.yaml"]
    ports:
      - "8081:8081"
    volumes:
      - ./onix:/app/config
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mock-network:
        condition: service_healthy
    networks:
      - beckn_network

  onix-bpp:
    image: fidedocker/onix-adapter
    platform: linux/amd64
    command: ["./server", "--config=/app/config/bpp.yaml"]
    ports:
      - "8082:8082"
    volumes:
      - ./onix:/app/config
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mock-network:
        condition: service_healthy
    networks:
      - beckn_network

  # ONIX adapter for the second BPP (Serg Ops). Same image, different
  # config + identity — listens on a separate port and signs with its
  # own Ed25519 keypair (registered in mock-network as bpp-serg.example.com).
  onix-bpp-serg:
    image: fidedocker/onix-adapter
    platform: linux/amd64
    command: ["./server", "--config=/app/config/bpp-serg.yaml"]
    ports:
      - "8083:8083"
    volumes:
      - ./onix:/app/config
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mock-network:
        condition: service_healthy
    networks:
      - beckn_network

  # ─── Nuestros servicios ───────────────────────────────────────────

  # MARKETPLACE (BAP - Beckn Application Platform)
  # Lado comprador del marketplace. Lo que el usuario/frontend consume.
  # Recibe callbacks on_* de ONIX y expone API REST para el frontend.
  #
  # Equipo: Beckn/Protocol (Luis)
  # Codigo: services/bap/
  bap-marketplace:
    build:
      context: ..
      dockerfile: services/bap/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BAP_CALLER_URL=http://onix-bap:8081/bap/caller
      - SERVICE_NAME=bap-marketplace
      - DB_HOST=postgres-bap
      - DB_PORT=5432
      - DB_NAME=${BAP_DB_NAME}
      - DB_USER=${BAP_DB_USER}
      - DB_PASSWORD=${BAP_DB_PASSWORD}
      # Planner orchestration — see services/bap/app/routes/plan.py
      - PLANNER_URL=http://planner:3010
      - PLAN_RATE_LIMIT=${PLAN_RATE_LIMIT:-10/minute}
      - DISCOVER_TIMEOUT_S=${DISCOVER_TIMEOUT_S:-10}
      - PLANNER_TIMEOUT_S=${PLANNER_TIMEOUT_S:-60}
    depends_on:
      postgres-bap:
        condition: service_healthy
      planner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # PROVIDER (BPP - Beckn Provider Platform)
  # Lado proveedor. Publica catalogo de agentes IA, recibe transacciones
  # Beckn (select/init/confirm), y delega ejecucion al orchestrator.
  # Espera a que orchestrator este healthy antes de arrancar: el BPP
  # llama a POST /execute en runtime (confirm) y necesita que el
  # orquestador este listo para no perder el primer request.
  #
  # Equipo: Beckn/Protocol (Luis) + Database
  # Codigo: services/bpp/
  bpp-provider:
    build:
      context: ..
      dockerfile: services/bpp/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - BPP_CALLBACK_URL=http://onix-bpp:8082/bpp/caller
      - ORCHESTRATOR_URL=http://orchestrator:3008
      - SERVICE_NAME=bpp-provider
      - AGENT_URL_MAP={"agent-summarizer-001":"http://agents:3004","agent-code-reviewer-001":"http://agents:3004","agent-data-extractor-001":"http://agents:3004"}
      - DB_HOST=postgres-bpp
      - DB_PORT=5432
      - DB_NAME=${BPP_DB_NAME}
      - DB_USER=${BPP_DB_USER}
      - DB_PASSWORD=${BPP_DB_PASSWORD}
    depends_on:
      orchestrator:
        condition: service_healthy
      postgres-bpp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # PROVIDER 2 (BPP-Serg)
  # Second BPP with a different provider identity ("Serg Ops") and a different
  # agent runtime (services/agents-serg, OrderedApi-derived). Coexists with
  # bpp-provider so a single discover returns agents from both providers.
  # Iter 0: still uses an in-memory catalog (services/bpp-serg/app/catalog_data.py)
  # — Postgres migration tracked separately.
  bpp-serg:
    build:
      context: ..
      dockerfile: services/bpp-serg/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - BPP_ID=bpp-serg.example.com
      - BPP_URI=http://onix-bpp-serg:8083/bpp/receiver
      - BPP_CALLBACK_URL=http://onix-bpp-serg:8083/bpp/caller
      - ORCHESTRATOR_URL=http://orchestrator:3008
      - SERVICE_NAME=bpp-serg
      - AGENT_ROUTING_FILE=/app/config/agent-routing/serg.yaml
    volumes:
      - ./agent-routing:/app/config/agent-routing:ro
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # PLANNER
  # Descompone prompts de usuario en secuencia de skills via LLM.
  # Servicio stateless, solo necesita GROQ_API_KEY para llamar al modelo.
  #
  # Equipo: Orchestrator
  # Codigo: services/planner/
  planner:
    build:
      context: ..
      dockerfile: services/planner/Dockerfile
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - SERVICE_NAME=planner
      - PLANNER_VERSION=2.0.0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PLANNER_MODEL=${PLANNER_MODEL:-llama-3.3-70b-versatile}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # ORCHESTRATOR
  # Multi-agent orchestrator con LLM-guided execution plans.
  # Usa ORCHESTRATOR-LLM (Groq) para interpretar planes, construir payloads,
  # y validar respuestas de agentes.
  #
  # Equipo: Orchestrator
  # Codigo: services/orchestrator2/
  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator2/Dockerfile
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - SERVICE_NAME=orchestrator
      - ORCHESTRATOR_VERSION=2.0.0
      - INTERNAL_TOKEN=dev-internal-token
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # AGENTS — Agentes IA individuales. El orchestrator los invoca via POST /task.
  #
  # Equipo: Agentes IA
  # Codigo: services/agents/
  agents:
    build:
      context: ..
      dockerfile: services/agents/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - SERVICE_NAME=agents
      - GROQ_API_KEY=${GROQ_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - beckn_network

  # DISCOVERY SERVICE — local DS that fans out a `discover` to every
  # registered BPP. Replaces the production DS hosted by Beckn One at
  # fabric.nfh.global until we have a public domain. ONIX-BAP routes
  # the discover action here (see infra/onix/generic-routing-BAPCaller.yaml);
  # each BPP responds with its own on_discover via the standard ONIX path.
  discovery:
    build:
      context: ..
      dockerfile: services/discovery/Dockerfile
    ports:
      - "3007:3007"
    environment:
      - DISCOVERY_CONFIG_PATH=/app/config/bpps.yaml
    volumes:
      - ./discovery:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - beckn_network

  # AGENTS-SERG — Agentes IA de Serg Ops (6 agentes derivados de OrderedApi:
  # summarizer, extractor, code reviewer, translator, email writer, sentiment).
  # Expone /task con el mismo contrato que `agents` para que el orchestrator
  # pueda invocar a ambos sin saber cual es cual.
  agents-serg:
    build:
      context: ..
      dockerfile: services/agents-serg/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - SERVICE_NAME=agents-serg
      - GROQ_API_KEY=${GROQ_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - beckn_network

  # FRONTEND — React + Next.js
  # UI del marketplace. Consume la API REST del BAP via rewrites de Next.js.
  # Todas las llamadas al BAP van a /api/bap/* y Next.js las proxea internamente.
  #
  # Equipo: Frontend
  # Codigo: services/frontend/
  frontend:
    build:
      context: ..
      dockerfile: services/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BAP_URL=http://bap-marketplace:3001
      - MOCKNET_URL=http://mock-network:8090
    depends_on:
      bap-marketplace:
        condition: service_healthy
      mock-network:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beckn_network

  # CATALOG PUBLISHER — one-shot init job (no es un servicio persistente).
  # En cuanto los BPPs y el CDS estan healthy, publica los catalogos de ambos
  # proveedores al CDS (mock-network) para que `discover` devuelva resultados
  # sin tener que correr `POST /api/publish` a mano. El indice del CDS es
  # volatil (se pierde al reiniciar), por eso esto corre en cada `compose up`.
  # Reintenta porque ONIX-BPP puede tardar un instante mas en estar listo.
  catalog-publisher:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      bpp-provider:
        condition: service_healthy
      bpp-serg:
        condition: service_healthy
      mock-network:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        publish() {
          name=$$1; url=$$2;
          for i in $$(seq 1 10); do
            if curl -fsS -X POST "$$url" -H "Content-Type: application/json" -d '{}'; then
              echo " -> $$name catalog published"; return 0;
            fi;
            echo "... $$name publish attempt $$i failed, retrying in 3s"; sleep 3;
          done;
          echo " !! $$name publish failed after retries"; return 1;
        };
        publish "bpp-provider" "http://bpp-provider:3002/api/publish" &&
        publish "bpp-serg"     "http://bpp-serg:3005/api/publish"
    networks:
      - beckn_network

volumes:
  pgdata-bap:
  pgdata-bpp:
  pgdata-mocknet:

networks:
  beckn_network:
    driver: bridge
