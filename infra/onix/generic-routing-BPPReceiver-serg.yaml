# BPP Receiver Routing — inbound action requests from BAPs to our BPP-Serg service.
#
# All action requests are forwarded to bpp-serg (our FastAPI BPP-Serg backend).

routingRules:
  - networkId: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      url: "http://bpp-serg:3005/api/webhook"
    endpoints:
      - discover
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support
      - on_publish
