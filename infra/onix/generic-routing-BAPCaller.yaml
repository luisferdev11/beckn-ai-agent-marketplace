# BAP Caller Routing — outbound requests from BAP to BPPs / CDS
#
# networkId "beckn.one/testnet" maps to the v2.0.0 context.networkId field.
# The adapter router resolves targetType "bpp" via DeDi registry lookup (bppId).
# The CDS URL below handles discover and catalog/publish; update it for your network.

routingRules:
  # Transaction & fulfillment actions: routed to the BPP via registry lookup
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "bpp"
    endpoints:
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support

  # Discovery: routed to the CDS at mock-network (Pieza 2 of discover v2).
  # CDS owns the catalog index built from catalog/publish; one query, one
  # on_discover response with one catalog per BPP. The previous fan-out
  # Discovery Service is deprecated — see services/discovery/.
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      url: "http://mock-network:8090/beckn"
    endpoints:
      - discover
